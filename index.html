<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hot Spot Automatic 12H</title>
</head>
<body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<div id="boot" style="padding:24px">Loading Hot Spot…</div>
<script>
(async()=>{
  try{
    let shell=await fetch('/index-shell.html?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Unable to load app shell');return r.text();});
    const target='document.write(src);';
    const replacement="document.write(src.replace('</body>','<scr'+'ipt src=\"/manual-live-patch.js?ts='+Date.now()+'\"></scr'+'ipt></body>'));";
    if(!shell.includes(target))throw new Error('App shell injection point not found');
    shell=shell.replace(target,replacement);
    document.open();
    document.write(shell);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='Hot Spot failed to load: '+(e&&e.message?e.message:e);
  }
})();
</script>
</body>
</html>
