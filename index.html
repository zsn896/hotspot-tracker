<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hot Spot Automatic 12H</title>
</head>
<body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<div id="boot" style="padding:24px">Loading Hot Spot…</div>
<script>
(async()=>{
  try{
    let html=await fetch('/index-base.html?ts='+Date.now(),{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Unable to load base UI');
      return r.text();
    });

    const css=`
.wavePanel{margin-top:14px;padding:14px;border-radius:13px;border:1px solid #3a4b60;background:rgba(7,17,31,.42)}
.waveTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.waveState{font-size:20px;font-weight:950}
.waveMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.waveBadge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:900}
.waveMessage{margin-top:10px;line-height:1.45;font-size:13px}
.waveAlertBtn{border:1px solid #4b5f78;background:#203249;color:white;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}
.wave-DORMANT{color:#9fb0c7;border-color:#3a4b60}
.wave-EARLY_SIGNAL{color:#f6c453;border-color:rgba(246,196,83,.55);background:rgba(246,196,83,.06)}
.wave-RISING{color:#55a2ff;border-color:rgba(85,162,255,.55);background:rgba(47,128,255,.08)}
.wave-STRONG{color:#43ea82;border-color:rgba(67,234,130,.60);background:rgba(34,197,94,.09)}
.wave-COOLING{color:#b5c3d6;border-color:#51647b;background:rgba(159,176,199,.05)}
.wave-REBOUND_WATCH{color:#ff9d3b;border-color:rgba(255,157,59,.60);background:rgba(255,146,43,.08)}
.learnerWaveTitle{font-size:12px;color:#b7c7da;font-weight:900;letter-spacing:.3px}
.learnerGroupNums{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.learnerBall{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:16px;font-weight:950;color:#fff;border:1px solid #6d8fb8;background:linear-gradient(180deg,#24486e,#173653)}
.learnerHits{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.learnerHit{font-size:12px;font-weight:900;padding:7px 9px;border-radius:8px;background:rgba(7,17,31,.35);border:1px solid rgba(159,176,199,.24);color:#d9e5f3}
.trackerBox{margin-top:14px;padding:13px;border-radius:13px;border:1px solid rgba(67,234,130,.34);background:rgba(4,13,24,.46)}
.trackerHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trackerTitle{font-size:14px;font-weight:1000;color:#fff}
.trackerRule{font-size:11px;color:#91a5bd;margin-top:4px;line-height:1.4}
.trackerSection{margin-top:13px}
.trackerSectionTitle{font-size:11px;font-weight:950;color:#a9bad0;margin-bottom:7px}
.trackerEmpty{font-size:12px;color:#869ab2;padding:9px;border:1px dashed #3d4d61;border-radius:10px}
.trackerCard{padding:11px;margin-top:8px;border-radius:11px;border:1px solid #3c5067;background:rgba(10,25,42,.72)}
.trackerCard.active{border-color:rgba(67,234,130,.48)}
.trackerCard.historical{border-color:rgba(159,176,199,.32);opacity:.86}
.trackerCard.hit{border-color:#43ea82;box-shadow:0 0 0 1px rgba(67,234,130,.18)}
.trackerRow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trackerNums{display:flex;gap:6px;flex-wrap:wrap}
.trackerBall{min-width:34px;height:34px;padding:0 4px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:950;background:#18334e;border:1px solid #547493;color:#fff}
.trackerStatus{font-size:17px;font-weight:1000;color:#f4d273}
.trackerStatus.hitNow{color:#43ea82}
.trackerMini{font-size:11px;color:#a9bad0;margin-top:7px;line-height:1.45}
.trackerTag{display:inline-block;font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;margin-inline-start:5px;border:1px solid #50637a;color:#c9d5e3}
.manualForm{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.manualInput{flex:1;min-width:190px;background:#07111f;color:#fff;border:1px solid #455b73;border-radius:9px;padding:10px 11px;font-size:14px;outline:none}
.manualBtn{border:1px solid #3e8b60;background:#1d5838;color:#fff;border-radius:9px;padding:9px 12px;font-weight:950;cursor:pointer}
.manualRemove{border:0;background:transparent;color:#ff9b9b;font-size:12px;font-weight:900;cursor:pointer;padding:4px}
.manualError{font-size:11px;color:#ff9b9b;margin-top:6px;min-height:15px}
.trackerUpdated{font-size:10px;color:#71879e}
`;

    const addon=`<script>
(function(){
  const WAVE_KEY='hotspot_group_five_wave';
  const AUTO_KEY='hotspot_core_auto_saved_v3';
  const MANUAL_KEY='hotspot_core_manual_saved_v3';
  const allowed=['DORMANT','EARLY_SIGNAL','RISING','STRONG','COOLING','REBOUND_WATCH'];
  const labels={DORMANT:'DORMANT',EARLY_SIGNAL:'EARLY SIGNAL',RISING:'RISING',STRONG:'STRONG',COOLING:'COOLING',REBOUND_WATCH:'REBOUND WATCH'};
  const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
  let autoDetails=[];
  let manualDetails=[];
  let trackerLatest=null;

  function stateClass(state){const s=String(state||'DORMANT').toUpperCase();return allowed.includes(s)?'wave-'+s:'wave-DORMANT';}
  function label(state){const s=String(state||'DORMANT').toUpperCase();return labels[s]||s;}
  function keyOf(nums){return (nums||[]).map(Number).filter(Number.isFinite).sort((a,b)=>a-b).join('-');}
  function readJson(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x??fallback;}catch(e){return fallback;}}
  function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}}
  function readWave(){return readJson(WAVE_KEY,null);}
  function storeWave(payload){writeJson(WAVE_KEY,payload);}
  function readSets(key){
    const raw=readJson(key,[]);
    if(!Array.isArray(raw)) return [];
    const seen=new Set();
    return raw.map(x=>Array.isArray(x)?x:[]).map(x=>[...new Set(x.map(Number))].filter(n=>Number.isInteger(n)&&n>=1&&n<=80).sort((a,b)=>a-b)).filter(x=>x.length>=3&&x.length<=5).filter(x=>{const k=keyOf(x);if(seen.has(k))return false;seen.add(k);return true;});
  }
  function saveSets(key,sets){writeJson(key,sets);}
  function mergeAutoSets(coreData){
    const old=readSets(AUTO_KEY);
    const incoming=[...(coreData?.activeCore3||[]),...(coreData?.historicalStrongCore3||[])].map(x=>x?.numbers).filter(Array.isArray);
    const all=[...old,...incoming];
    const seen=new Set();
    const merged=[];
    for(const nums of all){
      const n=[...new Set(nums.map(Number))].filter(x=>Number.isInteger(x)&&x>=1&&x<=80).sort((a,b)=>a-b);
      if(n.length!==3) continue;
      const k=keyOf(n);if(seen.has(k)) continue;seen.add(k);merged.push(n);
    }
    saveSets(AUTO_KEY,merged);
    return merged;
  }
  function ensurePanel(id,afterId){
    let panel=document.getElementById(id);if(panel)return panel;
    const anchor=document.getElementById(afterId);if(!anchor)return null;
    panel=document.createElement('div');panel.id=id;anchor.insertAdjacentElement('afterend',panel);return panel;
  }

  window.enableWaveNotifications=async function(){
    if(!('Notification' in window)){alert('Browser notifications are not supported on this device/browser.');return;}
    try{const p=await Notification.requestPermission();const b=document.getElementById('waveAlertButton');if(b)b.textContent=p==='granted'?'Alerts Enabled':'Enable Alerts';}catch(e){}
  };

  function maybeNotify(drawId,wave){
    if(!wave?.alert||!('Notification' in window)||Notification.permission!=='granted') return;
    const key=String(drawId||'')+':'+String(wave.state||'')+':'+String(wave.score||0);
    if(localStorage.getItem('hotspot_wave_alert_key')===key)return;
    localStorage.setItem('hotspot_wave_alert_key',key);
    try{new Notification('Hot Spot Group Five — '+label(wave.state),{body:wave.messageAr||('Wave score '+Number(wave.score||0)+'/100')});}catch(e){}
  }

  function statusFor(detail){
    const c=detail?.current||{};
    if(c.appearedNow) return {text:'ظهر الآن ✅',hit:true};
    const rem=Number(c.remainingToAverage);
    if(Number.isFinite(rem)){
      if(rem>0) return {text:'باقي '+rem+' سحبة',hit:false};
      if(rem===0) return {text:'الآن تقريبًا',hit:false};
      return {text:'تجاوز المتوسط بـ '+Math.abs(rem)+' سحبة',hit:false};
    }
    return {text:'لا يوجد تاريخ كافٍ',hit:false};
  }

  function cardForTracker(t,kind){
    const nums=Array.isArray(t?.numbers)?t.numbers:[];
    const focus=nums.length===3?t?.fullSet:(t?.core3||t?.fullSet);
    const full=t?.fullSet||{};
    const c=focus?.current||{};
    const a=focus?.analysis||{};
    const fullNow=Boolean(full?.current?.appearedNow);
    const st=fullNow?{text:'المجموعة كاملة ظهرت الآن ✅',hit:true}:statusFor(focus);
    const stale=kind==='auto'&&Number(c.currentGap)>25;
    const cls='trackerCard '+(st.hit?'hit ':(stale?'historical ':'active '));
    let tag='';
    if(kind==='auto') tag=stale?'قوي سابقًا':'قوي حالي';
    else tag='يدوي';
    const subCore=nums.length>3&&focus?.numbers?.length===3?'<div class="trackerMini">أقوى Core3 داخلها: <b>'+esc(focus.numbers.join(' - '))+'</b></div>':'';
    const together=Number(a.together||0);
    const avg=Number(a.meanGap);
    const last=a.lastTogetherDrawId?('Draw '+a.lastTogetherDrawId+(a.lastTogetherTime?' · '+a.lastTogetherTime:'')):'لا يوجد ظهور كامل في الداتا الحالية';
    return '<div class="'+cls+'">'
      +'<div class="trackerRow"><div><div class="trackerNums">'+nums.map(n=>'<div class="trackerBall">'+esc(n)+'</div>').join('')+'</div></div>'
      +'<div><span class="trackerTag">'+esc(tag)+'</span>'+(kind==='manual'?'<button class="manualRemove" onclick="removeManualSet(\''+esc(keyOf(nums))+'\')">حذف</button>':'')+'</div></div>'
      +'<div class="trackerStatus '+(st.hit?'hitNow':'')+'">'+esc(st.text)+'</div>'
      +subCore
      +'<div class="trackerMini">ظهر معًا '+together+' مرات'+(Number.isFinite(avg)&&avg>0?' · متوسط الفاصل '+avg+' سحبة':'')+' · آخر ظهور: '+esc(last)+'</div>'
      +'</div>';
  }

  function renderTrackerBox(){
    const panel=document.getElementById('coreTrackerBox');if(!panel)return;
    const active=autoDetails.filter(t=>Number((t?.fullSet||{}).current?.currentGap)<=25||Boolean((t?.fullSet||{}).current?.appearedNow));
    const hist=autoDetails.filter(t=>Number((t?.fullSet||{}).current?.currentGap)>25);
    panel.innerHTML=''
      +'<div class="trackerHead"><div><div class="trackerTitle">CORE TRACKER — متابعة لحظية</div><div class="trackerRule">التلقائي لا يدخل إلا بعد 10 ظهورات مشتركة 3/3. القديم لا يُحذف؛ إذا تجاوز 25 سحبة ينتقل إلى قوي سابقًا.</div></div><div class="trackerUpdated">آخر Draw: '+esc(trackerLatest||'—')+'</div></div>'
      +'<div class="trackerSection"><div class="trackerSectionTitle">ACTIVE STRONG</div>'+(active.length?active.map(t=>cardForTracker(t,'auto')).join(''):'<div class="trackerEmpty">لا يوجد Core3 وصل حاليًا إلى شرط 10 ظهورات مشتركة.</div>')+'</div>'
      +(hist.length?'<div class="trackerSection"><div class="trackerSectionTitle">HISTORICAL STRONG</div>'+hist.map(t=>cardForTracker(t,'auto')).join('')+'</div>':'')
      +'<div class="trackerSection"><div class="trackerSectionTitle">إدخال يدوي — 3 إلى 5 أرقام</div><div class="manualForm"><input id="manualCoreInput" class="manualInput" inputmode="numeric" placeholder="مثال: 1 2 3 4 5"><button class="manualBtn" onclick="addManualSet()">إضافة ومتابعة</button></div><div id="manualCoreError" class="manualError"></div>'
      +(manualDetails.length?manualDetails.map(t=>cardForTracker(t,'manual')).join(''):'<div class="trackerEmpty">لا توجد أرقام يدوية محفوظة.</div>')+'</div>';
  }

  window.addManualSet=function(){
    const input=document.getElementById('manualCoreInput');const err=document.getElementById('manualCoreError');if(!input)return;
    const nums=[...new Set(String(input.value||'').split(/[^0-9]+/).filter(Boolean).map(Number))].filter(n=>Number.isInteger(n)&&n>=1&&n<=80).sort((a,b)=>a-b);
    if(nums.length<3||nums.length>5){if(err)err.textContent='أدخل 3 أو 4 أو 5 أرقام مختلفة من 1 إلى 80.';return;}
    const sets=readSets(MANUAL_KEY);const k=keyOf(nums);
    if(!sets.some(x=>keyOf(x)===k))sets.push(nums);
    saveSets(MANUAL_KEY,sets);input.value='';if(err)err.textContent='';refreshTrackerDetails();
  };

  window.removeManualSet=function(key){
    const sets=readSets(MANUAL_KEY).filter(x=>keyOf(x)!==key);saveSets(MANUAL_KEY,sets);refreshTrackerDetails();
  };

  async function evaluateSets(sets){
    if(!sets.length)return [];
    const q=sets.slice(0,24).map(x=>x.join('-')).join(';');
    try{
      const r=await fetch('/api/health?mode=tracker-evaluate&sets='+encodeURIComponent(q)+'&ts='+Date.now(),{cache:'no-store'});
      if(!r.ok)return [];
      const j=await r.json();trackerLatest=j.latestDrawId||trackerLatest;return Array.isArray(j.trackers)?j.trackers:[];
    }catch(e){return [];}
  }

  async function refreshTrackerDetails(){
    const autoSets=readSets(AUTO_KEY);const manualSets=readSets(MANUAL_KEY);
    const [a,m]=await Promise.all([evaluateSets(autoSets),evaluateSets(manualSets)]);
    autoDetails=a;manualDetails=m;renderTrackerBox();
  }

  function renderGroupWave(payload,coreData){
    const wave=payload?.wave||null;
    const panel=ensurePanel('wavePanel','learnerWavePanel')||ensurePanel('wavePanel','learnerContent');if(!panel)return;
    const state=String(wave?.state||'DORMANT').toUpperCase();
    const nums=Array.isArray(coreData?.groupFive?.numbers)?coreData.groupFive.numbers:(Array.isArray(payload?.numbers)?payload.numbers:[]);
    panel.className='wavePanel '+stateClass(state);
    panel.innerHTML=''
      +'<div class="waveTop"><div><div class="small mut">Group Five / Early Wave Detection</div><div class="waveState">'+esc(label(state))+'</div></div>'
      +'<button class="waveAlertBtn" id="waveAlertButton" onclick="enableWaveNotifications()">'+(("Notification" in window)&&Notification.permission==='granted'?'Alerts Enabled':'Enable Alerts')+'</button></div>'
      +(nums.length===5?'<div class="learnerGroupNums">'+nums.map(n=>'<div class="learnerBall">'+esc(n)+'</div>').join('')+'</div>':'')
      +'<div class="waveMeta"><span class="waveBadge">Wave '+Number(wave?.score||0)+'/100</span><span class="waveBadge">'+esc(wave?.alertLevel||'NONE')+'</span></div>'
      +'<div id="coreTrackerBox" class="trackerBox"></div>'
      +(wave?'<div class="waveMessage">'+esc(wave.messageAr||wave.message||'No clear wave signal right now.')+'</div>':'');
    renderTrackerBox();
  }

  function renderLearnerDetail(data){
    const numbers=Array.isArray(data?.numbers)?data.numbers.map(Number).filter(Number.isFinite):[];if(!data?.active||numbers.length!==5)return;
    const panel=ensurePanel('learnerWavePanel','learnerContent');if(!panel)return;
    const wave=data?.wave||{};const state=String(wave.state||'DORMANT').toUpperCase();const l20=data?.comparison?.last20||{};
    panel.className='wavePanel '+stateClass(state);
    panel.innerHTML=''
      +'<div class="waveTop"><div><div class="learnerWaveTitle">12H WAVE WATCH</div><div class="waveState">'+esc(label(state))+'</div></div><div class="waveMeta"><span class="waveBadge">Score '+Number(wave.score||0)+'/100</span><span class="waveBadge">'+esc(wave.alertLevel||'NONE')+'</span></div></div>'
      +'<div class="learnerGroupNums">'+numbers.map(n=>'<div class="learnerBall">'+esc(n)+'</div>').join('')+'</div>'
      +'<div class="learnerHits"><span class="learnerHit">آخر 20 سحبة</span><span class="learnerHit">3/5+ = '+Number(l20.threePlus||0)+'</span><span class="learnerHit">4/5+ = '+Number(l20.fourPlus||0)+'</span><span class="learnerHit">5/5 = '+Number(l20.exact5||0)+'</span></div>';
  }

  async function refreshLearnerWave(){
    try{const r=await fetch('/api/health?mode=learner-wave-detail&ts='+Date.now(),{cache:'no-store'});if(r.ok)renderLearnerDetail(await r.json());}catch(e){}
  }

  async function refreshGroupWave(){
    const stored=readWave();
    try{
      const [syncRes,coreRes]=await Promise.all([
        fetch('/api/sync?ts='+Date.now(),{cache:'no-store'}),
        fetch('/api/health?mode=group-five-core3&ts='+Date.now(),{cache:'no-store'})
      ]);
      const coreData=coreRes.ok?await coreRes.json():null;
      if(coreData){trackerLatest=coreData.latestDrawId||trackerLatest;mergeAutoSets(coreData);}
      let payload=stored||{drawId:coreData?.latestDrawId||null,numbers:coreData?.groupFive?.numbers||[],wave:null};
      if(syncRes.ok){
        const j=await syncRes.json();const groupFive=j?.worker?.groupFive||j?.groupFive||null;const wave=groupFive?.wave||stored?.wave||null;
        payload={drawId:j?.officialDrawId||j?.storedDrawId||coreData?.latestDrawId||groupFive?.lastSeenDrawId||null,numbers:Array.isArray(groupFive?.numbers)?groupFive.numbers:(coreData?.groupFive?.numbers||[]),wave};
        if(wave){storeWave(payload);maybeNotify(payload.drawId,wave);}
      }
      renderGroupWave(payload,coreData);
      await refreshTrackerDetails();
    }catch(e){
      renderGroupWave(stored||{wave:null},null);await refreshTrackerDetails();
    }
  }

  function refreshAll(){refreshLearnerWave();refreshGroupWave();}
  setTimeout(refreshAll,1000);
  setInterval(refreshAll,30000);
  window.addEventListener('focus',refreshAll);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll();});
})();
<\/script>`;

    if(html.includes('</style>')) html=html.replace('</style>',css+'\n</style>');
    if(html.includes('</body>')) html=html.replace('</body>',addon+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='Hot Spot failed to load: '+(e?.message||e);
  }
})();
</script>
</body>
</html>
