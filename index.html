<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hot Spot Automatic 12H</title>
</head>
<body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<div id="boot" style="padding:24px">Loading Hot Spot…</div>
<script>
(async()=>{
  try{
    let html=await fetch('/index-base.html?ts='+Date.now(),{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Unable to load base UI');
      return r.text();
    });

    const css=`
.wavePanel{margin-top:14px;padding:14px;border-radius:13px;border:1px solid #3a4b60;background:rgba(7,17,31,.42)}
.waveTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.waveState{font-size:20px;font-weight:950}
.waveMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.waveBadge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:900}
.waveMessage{margin-top:10px;line-height:1.45;font-size:13px}
.waveAlertBtn{border:1px solid #4b5f78;background:#203249;color:white;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}
.wave-DORMANT{color:#9fb0c7;border-color:#3a4b60}
.wave-EARLY_SIGNAL{color:#f6c453;border-color:rgba(246,196,83,.55);background:rgba(246,196,83,.06)}
.wave-RISING{color:#55a2ff;border-color:rgba(85,162,255,.55);background:rgba(47,128,255,.08)}
.wave-STRONG{color:#43ea82;border-color:rgba(67,234,130,.60);background:rgba(34,197,94,.09);box-shadow:0 0 0 1px rgba(34,197,94,.12)}
.wave-COOLING{color:#b5c3d6;border-color:#51647b;background:rgba(159,176,199,.05)}
.wave-REBOUND_WATCH{color:#ff9d3b;border-color:rgba(255,157,59,.60);background:rgba(255,146,43,.08)}
.learnerWaveTitle{font-size:12px;color:#b7c7da;font-weight:900;letter-spacing:.3px}
.learnerGroupNums{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.learnerBall{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:16px;font-weight:950;color:#fff;border:1px solid #6d8fb8;background:linear-gradient(180deg,#24486e,#173653)}
.learnerHits{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.learnerHit{font-size:12px;font-weight:900;padding:7px 9px;border-radius:8px;background:rgba(7,17,31,.35);border:1px solid rgba(159,176,199,.24);color:#d9e5f3}
.coreCard{margin-top:12px;padding:12px;border-radius:12px;border:1px solid rgba(67,234,130,.35);background:rgba(7,17,31,.38)}
.coreTitle{font-size:12px;font-weight:950;color:#a9bad0}
.coreNums{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.coreBall{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;font-size:18px;font-weight:950;color:#fff;border:2px solid rgba(67,234,130,.65);background:linear-gradient(180deg,#23543c,#153928)}
.coreStats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.coreStat{font-size:11px;font-weight:900;padding:7px 9px;border-radius:8px;border:1px solid rgba(159,176,199,.24);background:rgba(7,17,31,.35);color:#d9e5f3}
.coreLine{margin-top:8px;font-size:12px;line-height:1.5;color:#c7d5e5}
.coreState{display:inline-flex;margin-top:10px;padding:6px 10px;border-radius:999px;border:1px solid currentColor;font-size:12px;font-weight:950}
.core-ACTIVE{color:#43ea82}.core-WATCH{color:#f6c453}.core-COOLING{color:#9fb0c7}.core-INSUFFICIENT{color:#9fb0c7}
`;

    const addon=`<script>
(function(){
  const STORAGE_KEY='hotspot_group_five_wave';
  const allowed=['DORMANT','EARLY_SIGNAL','RISING','STRONG','COOLING','REBOUND_WATCH'];
  const labels={DORMANT:'DORMANT',EARLY_SIGNAL:'EARLY SIGNAL',RISING:'RISING',STRONG:'STRONG',COOLING:'COOLING',REBOUND_WATCH:'REBOUND WATCH'};
  const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));

  function stateClass(state){
    const s=String(state||'DORMANT').toUpperCase();
    return allowed.includes(s)?'wave-'+s:'wave-DORMANT';
  }
  function label(state){
    const s=String(state||'DORMANT').toUpperCase();
    return labels[s]||s;
  }
  function readStored(){
    try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
  }
  function storeWave(payload){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));}catch(e){}
  }
  function ensurePanel(id,afterId){
    let panel=document.getElementById(id);
    if(panel) return panel;
    const anchor=document.getElementById(afterId);
    if(!anchor) return null;
    panel=document.createElement('div');
    panel.id=id;
    anchor.insertAdjacentElement('afterend',panel);
    return panel;
  }

  window.enableWaveNotifications=async function(){
    if(!('Notification' in window)){alert('Browser notifications are not supported on this device/browser.');return;}
    try{
      const p=await Notification.requestPermission();
      const b=document.getElementById('waveAlertButton');
      if(b) b.textContent=p==='granted'?'Alerts Enabled':'Enable Alerts';
    }catch(e){}
  };

  function maybeNotify(drawId,wave){
    if(!wave?.alert||!('Notification' in window)||Notification.permission!=='granted') return;
    const key=String(drawId||'')+':'+String(wave.state||'')+':'+String(wave.score||0);
    if(localStorage.getItem('hotspot_wave_alert_key')===key) return;
    localStorage.setItem('hotspot_wave_alert_key',key);
    try{new Notification('Hot Spot Group Five — '+label(wave.state),{body:wave.messageAr||('Wave score '+Number(wave.score||0)+'/100')});}catch(e){}
  }

  function coreStateClass(state){
    const s=String(state||'INSUFFICIENT').toUpperCase();
    return 'core-'+(['ACTIVE','WATCH','COOLING','INSUFFICIENT'].includes(s)?s:'INSUFFICIENT');
  }

  function renderCore3(coreData){
    const core=coreData?.core3||null;
    if(!core||!Array.isArray(core.numbers)||core.numbers.length!==3) return '';
    const a=core.analysis||{};
    const s=core.sinceSelection||{};
    const c=core.current||{};
    const gaps=Array.isArray(a.gaps)&&a.gaps.length?a.gaps.join(' → '):'—';
    return '<div class="coreCard">'
      +'<div class="coreTitle">CORE3 الأقوى — الثلاثي الذي ظهر معًا فعليًا</div>'
      +'<div class="coreNums">'+core.numbers.map(n=>'<div class="coreBall">'+esc(n)+'</div>').join('')+'</div>'
      +'<div class="coreStats">'
      +'<span class="coreStat">اجتمع أثناء التحليل: '+Number(a.together||0)+' مرات</span>'
      +'<span class="coreStat">متوسط الفاصل: '+(a.meanGap==null?'—':esc(a.meanGap))+' سحبة</span>'
      +'<span class="coreStat">الفاصل الحالي: '+(c.currentGap==null?'—':esc(c.currentGap))+' سحبة</span>'
      +'</div>'
      +'<div class="coreLine">الفواصل السابقة: '+esc(gaps)+'</div>'
      +'<div class="coreLine">آخر اجتماع: Draw '+esc(a.lastTogetherDrawId||'—')+' · '+esc(a.lastTogetherTime||'—')+'</div>'
      +'<div class="coreLine">منذ اختيار Group Five: 3/3 = '+Number(s.together||0)+' · 2/3 = '+Number(s.partial2||0)+' · تتبع '+Number(coreData?.groupFive?.trackedDraws||0)+' سحبة</div>'
      +'<div class="coreState '+coreStateClass(c.state)+'">'+esc(c.state||'INSUFFICIENT')+'</div>'
      +'<div class="coreLine">'+esc(c.messageAr||'')+'</div>'
      +'</div>';
  }

  function renderGroupWave(payload,coreData){
    const wave=payload?.wave||null;
    if(!wave) return;
    const panel=ensurePanel('wavePanel','learnerWavePanel')||ensurePanel('wavePanel','learnerContent');
    if(!panel) return;
    const state=String(wave.state||'DORMANT').toUpperCase();
    const nums=Array.isArray(coreData?.groupFive?.numbers)?coreData.groupFive.numbers:(Array.isArray(payload?.numbers)?payload.numbers:[]);
    panel.className='wavePanel '+stateClass(state);
    panel.innerHTML=''
      +'<div class="waveTop">'
      +'<div><div class="small mut">Group Five / Early Wave Detection</div><div class="waveState">'+esc(label(state))+'</div></div>'
      +'<button class="waveAlertBtn" id="waveAlertButton" onclick="enableWaveNotifications()">'+(("Notification" in window)&&Notification.permission==='granted'?'Alerts Enabled':'Enable Alerts')+'</button>'
      +'</div>'
      +(nums.length===5?'<div class="learnerGroupNums">'+nums.map(n=>'<div class="learnerBall">'+esc(n)+'</div>').join('')+'</div>':'')
      +'<div class="waveMeta">'
      +'<span class="waveBadge">Wave '+Number(wave.score||0)+'/100</span>'
      +'<span class="waveBadge">'+esc(wave.alertLevel||'NONE')+'</span>'
      +(coreData?.groupFive?'<span class="waveBadge">Tracked '+Number(coreData.groupFive.trackedDraws||0)+'/20</span>':'')
      +'</div>'
      +renderCore3(coreData)
      +'<div class="waveMessage">'+esc(wave.messageAr||wave.message||'No clear wave signal right now.')+'</div>';
  }

  function renderLearnerDetail(data){
    const numbers=Array.isArray(data?.numbers)?data.numbers.map(Number).filter(Number.isFinite):[];
    if(!data?.active||numbers.length!==5) return;
    const panel=ensurePanel('learnerWavePanel','learnerContent');
    if(!panel) return;
    const wave=data?.wave||{};
    const state=String(wave.state||'DORMANT').toUpperCase();
    const l20=data?.comparison?.last20||{};
    panel.className='wavePanel '+stateClass(state);
    panel.innerHTML=''
      +'<div class="waveTop"><div><div class="learnerWaveTitle">12H WAVE WATCH</div><div class="waveState">'+esc(label(state))+'</div></div>'
      +'<div class="waveMeta"><span class="waveBadge">Score '+Number(wave.score||0)+'/100</span><span class="waveBadge">'+esc(wave.alertLevel||'NONE')+'</span></div></div>'
      +'<div class="learnerGroupNums">'+numbers.map(n=>'<div class="learnerBall">'+esc(n)+'</div>').join('')+'</div>'
      +'<div class="learnerHits">'
      +'<span class="learnerHit">آخر 20 سحبة</span>'
      +'<span class="learnerHit">3/5+ = '+Number(l20.threePlus||0)+'</span>'
      +'<span class="learnerHit">4/5+ = '+Number(l20.fourPlus||0)+'</span>'
      +'<span class="learnerHit">5/5 = '+Number(l20.exact5||0)+'</span>'
      +'</div>';
  }

  async function refreshLearnerWave(){
    try{
      const r=await fetch('/api/health?mode=learner-wave-detail&ts='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      renderLearnerDetail(await r.json());
    }catch(e){}
  }

  async function refreshGroupWave(){
    const stored=readStored();
    try{
      const [syncRes,coreRes]=await Promise.all([
        fetch('/api/sync?ts='+Date.now(),{cache:'no-store'}),
        fetch('/api/health?mode=group-five-core3&ts='+Date.now(),{cache:'no-store'})
      ]);
      if(!syncRes.ok) return;
      const j=await syncRes.json();
      const coreData=coreRes.ok?await coreRes.json():null;
      const groupFive=j?.worker?.groupFive||j?.groupFive||null;
      const wave=groupFive?.wave||stored?.wave||null;
      if(!wave) return;
      const payload={
        drawId:j?.officialDrawId||j?.storedDrawId||groupFive?.lastSeenDrawId||null,
        numbers:Array.isArray(groupFive?.numbers)?groupFive.numbers:(coreData?.groupFive?.numbers||[]),
        wave
      };
      storeWave(payload);
      renderGroupWave(payload,coreData);
      maybeNotify(payload.drawId,wave);
    }catch(e){
      if(stored?.wave) renderGroupWave(stored,null);
    }
  }

  function refreshAll(){refreshLearnerWave();refreshGroupWave();}
  setTimeout(refreshAll,1200);
  setInterval(refreshAll,60000);
  window.addEventListener('focus',refreshAll);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll();});
})();
<\/script>`;

    if(html.includes('</style>')) html=html.replace('</style>',css+'\n</style>');
    if(html.includes('</body>')) html=html.replace('</body>',addon+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='Hot Spot failed to load: '+(e?.message||e);
  }
})();
</script>
</body>
</html>
