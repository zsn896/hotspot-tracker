<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة مجموعات Hot Spot — سيرفر</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;margin:0;background:#f4f5f7;color:#17191c}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e5e9;border-radius:16px;padding:15px;margin:12px 0}.group{border-right:5px solid #111}.title{font-size:20px;font-weight:900}.inputs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.inputs input{width:54px;height:46px;border:1px solid #cfd4dc;border-radius:10px;text-align:center;font-size:18px;font-weight:800}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:850;font-size:15px;margin:3px}.start{background:#111;color:#fff}.stop{background:#8b1e1e;color:#fff}.reset{background:#eceff3;color:#111}.active{color:#087a3d;font-weight:900}.idle{color:#667085}.bad{color:#b42318}.mut{color:#667085}.server{color:#175cd3;font-weight:900}.row{border-top:1px solid #eceef1;padding:11px 0}.balls{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.ball{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eceff3;font-weight:800}.hit{background:#d92d20;color:#fff}.bull{box-shadow:0 0 0 4px #1570ef;background:#1570ef!important;color:#fff}.bullbadge{display:inline-block;background:#eaf2ff;color:#175cd3;border:1px solid #84adff;border-radius:999px;padding:5px 9px;font-weight:900;margin:5px 0}.score{font-size:22px;font-weight:900}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spin{display:inline-block;width:15px;height:15px;border:3px solid #bbb;border-top-color:#111;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.stat{border:1px solid #e4e7ec;border-radius:11px;padding:9px}.big{font-size:21px;font-weight:900}</style></head><body><div class="wrap">
<h1>متابعة المجموعات — محفوظة على السيرفر</h1><p class="mut">كل مجموعة مستقلة. بعد «ابدأ» تُحفظ الأرقام ونقطة البداية والنتائج في Supabase، وليست مرتبطة بهذا الهاتف فقط.</p>
<div class="card toolbar"><button class="btn start" id="refresh">تحديث النتائج الآن</button><button class="btn reset" id="worker">جلب السحبات وحسابها على السيرفر</button><span id="busy"></span><span id="global" class="mut">جاري الاتصال…</span></div>
<div id="groups"></div></div>
<script>
const OLDKEY='hotspot_multi_tracker_v1';let state={groups:Array.from({length:3},()=>({nums:['','','','',''],active:false,startId:null,lastSeenId:null,rows:[],id:null}))};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function validNums(g){const a=g.nums.map(Number);return a.length===5&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=80)&&new Set(a).size===5?a.sort((a,b)=>a-b):null}
function setBusy(t){document.getElementById('busy').innerHTML=t?`<span class="spin"></span> ${t}`:''}
async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',headers:{'content-type':'application/json'},...opt});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'فشل الاتصال');return j}
function groupHTML(g,i){const nums=validNums(g)||g.nums.map(Number).filter(Boolean);const rows=g.rows||[];const counts=[0,0,0,0,0,0];rows.forEach(r=>counts[r.count]++);return `<div class="card group"><div class="title">المجموعة ${i+1} <span class="${g.active?'active':'idle'}">${g.active?'● قيد المتابعة على السيرفر':'غير مفعلة'}</span></div><div class="inputs">${g.nums.map((v,j)=>`<input inputmode="numeric" maxlength="2" data-i="${i}" data-j="${j}" value="${esc(v)}" ${g.active?'disabled':''}>`).join('')}</div><div><button class="btn start" data-act="start" data-i="${i}" ${g.active?'disabled':''}>ابدأ</button><button class="btn stop" data-act="stop" data-i="${i}" ${!g.active?'disabled':''}>أوقف</button><button class="btn reset" data-act="reset" data-i="${i}">صفّر</button></div><p class="mut">${g.active?`بدأت بعد السحبة <b>${g.startId}</b> — آخر سحبة حُسبت <b>${g.lastSeenId??g.startId}</b>`:'لن تُحسب حتى تضغط ابدأ.'}</p>${rows.length?`<div class="summary"><div class="stat">السحبات<div class="big">${rows.length}</div></div><div class="stat">3/5 أو أكثر<div class="big">${counts[3]+counts[4]+counts[5]}</div></div><div class="stat">4/5<div class="big">${counts[4]}</div></div><div class="stat">5/5<div class="big">${counts[5]}</div></div></div><h3>آخر النتائج</h3>${rows.slice(0,30).map(r=>`<div class="row"><b>السحبة ${r.id}</b> — ${esc(r.time)} <span class="score">${r.count}/5</span><div>${r.bullsEyeMatch?`<span class="bullbadge">🔵 Bulls-eye ${r.bullsEye} ضمن المجموعة</span>`:`<span class="mut">Bulls-eye: ${r.bullsEye??'غير متاح'}</span>`}</div><div class="balls">${nums.map(n=>`<span class="ball ${r.hit.includes(n)?'hit':''} ${r.bullsEyeMatch&&n===r.bullsEye?'bull':''}">${n}</span>`).join('')}</div></div>`).join('')}`:''}</div>`}
function render(){document.getElementById('groups').innerHTML=state.groups.map(groupHTML).join('')}
async function loadState(){setBusy('جاري قراءة البيانات من السيرفر…');try{const j=await api('/api/state?ts='+Date.now());state={groups:Array.from({length:3},()=>({nums:['','','','',''],active:false,startId:null,lastSeenId:null,rows:[],id:null}))};for(const sg of j.groups||[]){const m=String(sg.name||'').match(/(\d+)/);const i=m?Number(m[1])-1:-1;if(i<0||i>2)continue;state.groups[i]={id:sg.id,nums:(sg.numbers||[]).map(String),active:true,startId:sg.start_draw_id,lastSeenId:sg.last_seen_draw_id,rows:(sg.results||[]).map(r=>({id:r.draw_id,date:r.date,time:r.time,count:r.hit_count,hit:r.hit_numbers||[],bullsEye:r.bulls_eye,bullsEyeMatch:r.bulls_eye_match}))};}render();document.getElementById('global').innerHTML=`<span class="server">● البيانات محفوظة على السيرفر</span>${j.latest?` — آخر محفوظة ${j.latest.draw_id} ${esc(j.latest.draw_time)}`:''}`;await migrateOldIfNeeded();}catch(e){document.getElementById('global').innerHTML=`<span class="bad">${esc(e.message)}</span>`;render()}finally{setBusy('')}}
async function migrateOldIfNeeded(){if(state.groups.some(g=>g.active))return;let old;try{old=JSON.parse(localStorage.getItem(OLDKEY))}catch{}if(!old?.groups?.some(g=>g.active))return;if(!confirm('وجدت مجموعات قديمة مفعلة على هذا الهاتف. هل تريد نقلها إلى السيرفر مع نقطة البداية القديمة؟'))return;for(let i=0;i<3;i++){const g=old.groups[i],nums=g&&validNums(g);if(g?.active&&nums)await api('/api/group',{method:'POST',body:JSON.stringify({action:'start',slot:i+1,numbers:nums,startDrawId:g.startId})});}await runWorker();}
async function startGroup(i){const g=state.groups[i],nums=validNums(g);if(!nums)return alert('أدخل خمسة أرقام مختلفة من 1 إلى 80.');setBusy('جاري حفظ المجموعة على السيرفر…');try{await api('/api/group',{method:'POST',body:JSON.stringify({action:'start',slot:i+1,numbers:nums})});await loadState();}catch(e){alert(e.message)}finally{setBusy('')}}
async function action(i,a){setBusy('جاري الحفظ…');try{await api('/api/group',{method:'POST',body:JSON.stringify({action:a,slot:i+1})});await loadState();}catch(e){alert(e.message)}finally{setBusy('')}}
async function runWorker(){setBusy('جاري جلب السحبات الرسمية وحساب الإصابات…');try{const j=await api('/api/worker?ts='+Date.now());document.getElementById('global').textContent=`آخر سحبة رسمية ${j.latest.id} — تمت معالجة ${j.processed} نتيجة`;await loadState();}catch(e){document.getElementById('global').innerHTML=`<span class="bad">${esc(e.message)}</span>`}finally{setBusy('')}}
document.addEventListener('input',e=>{if(e.target.matches('input[data-i]')){const i=+e.target.dataset.i,j=+e.target.dataset.j;state.groups[i].nums[j]=e.target.value.replace(/\D/g,'').slice(0,2)}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const i=+b.dataset.i;if(b.dataset.act==='start')startGroup(i);if(b.dataset.act==='stop')action(i,'stop');if(b.dataset.act==='reset')action(i,'reset')});
document.getElementById('refresh').onclick=loadState;document.getElementById('worker').onclick=runWorker;loadState();setInterval(loadState,240000);
</script></body></html>
