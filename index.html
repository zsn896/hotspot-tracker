<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hot Spot Automatic 12H</title>
</head>
<body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<div id="boot" style="padding:24px">Loading Hot Spot…</div>
<script>
(async()=>{
  try{
    let html=await fetch('/index-base.html?ts='+Date.now(),{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Unable to load base UI');
      return r.text();
    });

    const css=`
.wavePanel{margin-top:14px;padding:14px;border-radius:13px;border:1px solid #3a4b60;background:rgba(7,17,31,.42)}
.waveTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.waveState{font-size:20px;font-weight:950}
.waveMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.waveBadge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:900}
.waveMessage{margin-top:10px;line-height:1.45;font-size:13px}
.waveAlertBtn{border:1px solid #4b5f78;background:#203249;color:white;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}
.waveLeadership{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.waveLeadCard{padding:10px;border-radius:10px;border:1px solid rgba(159,176,199,.28);background:rgba(7,17,31,.34)}
.waveLeadLabel{font-size:11px;color:#9fb0c7;font-weight:850}
.waveLeadValue{margin-top:5px;font-size:15px;font-weight:950;color:#fff}
.waveSource{margin-top:8px;font-size:11px;color:#9fb0c7}
.wave-DORMANT{color:#9fb0c7;border-color:#3a4b60}
.wave-EARLY_SIGNAL{color:#f6c453;border-color:rgba(246,196,83,.55);background:rgba(246,196,83,.06)}
.wave-RISING{color:#55a2ff;border-color:rgba(85,162,255,.55);background:rgba(47,128,255,.08)}
.wave-STRONG{color:#43ea82;border-color:rgba(67,234,130,.60);background:rgba(34,197,94,.09);box-shadow:0 0 0 1px rgba(34,197,94,.12)}
.wave-COOLING{color:#b5c3d6;border-color:#51647b;background:rgba(159,176,199,.05)}
.wave-REBOUND_WATCH{color:#ff9d3b;border-color:rgba(255,157,59,.60);background:rgba(255,146,43,.08)}
.learnerWaveTitle{font-size:12px;color:#b7c7da;font-weight:900;letter-spacing:.3px}
.learnerCompactGrid{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.learnerCompactCard{flex:0 0 142px;padding:10px;border-radius:11px;border:1px solid rgba(110,143,184,.40);background:rgba(8,24,41,.54)}
.learnerCompactNumber{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-weight:950;color:#fff;border:1px solid #6d8fb8;background:linear-gradient(180deg,#24486e,#173653)}
.learnerCompactCount{margin-top:8px;font-size:12px;font-weight:900;color:#dce8f7}
.learnerCompactMeta{margin-top:4px;font-size:10px;line-height:1.4;color:#aebdd0;white-space:nowrap}
.learnerCompare{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid rgba(159,176,199,.18)}
.learnerCompareItem{font-size:11px;font-weight:900;padding:6px 8px;border-radius:8px;background:rgba(7,17,31,.35);border:1px solid rgba(159,176,199,.24);color:#d9e5f3}
@media(max-width:620px){.waveLeadership{grid-template-columns:1fr}.learnerCompactCard{flex-basis:132px}}
`;

    const addon=`<script>
(function(){
  const STORAGE_KEY='hotspot_group_five_wave';
  const allowed=['DORMANT','EARLY_SIGNAL','RISING','STRONG','COOLING','REBOUND_WATCH'];
  const labels={DORMANT:'DORMANT',EARLY_SIGNAL:'EARLY SIGNAL',RISING:'RISING',STRONG:'STRONG',COOLING:'COOLING',REBOUND_WATCH:'REBOUND WATCH'};
  const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));

  function stateClass(state){
    const s=String(state||'DORMANT').toUpperCase();
    return allowed.includes(s)?'wave-'+s:'wave-DORMANT';
  }
  function label(state){
    const s=String(state||'DORMANT').toUpperCase();
    return labels[s]||s;
  }
  function coreText(core){
    const nums=Array.isArray(core?.numbers)?core.numbers.map(Number).filter(Number.isFinite):[];
    return nums.length===3?nums.join(' - '):'—';
  }
  function readStored(){
    try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
  }
  function storeWave(payload){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));}catch(e){}
  }
  function dormantPayload(j){
    return {drawId:j?.officialDrawId||j?.storedDrawId||null,numbers:[],wave:{state:'DORMANT',stateAr:'جمود / انتظار تكوين Group Five',score:0,alert:false,alertLevel:'NONE',leadership:{currentLeaderCore3:null,previousLeaderCore3:null,leaderChanged:false,rotationBreadth:0,score:0},messageAr:'Group Five غير نشطة بعد. النظام ينتظر اكتمال بيانات الدورة المطلوبة ثم يبدأ مراقبة الموجة تلقائيًا.'}};
  }

  window.enableWaveNotifications=async function(){
    if(!('Notification' in window)){alert('Browser notifications are not supported on this device/browser.');return;}
    try{
      const p=await Notification.requestPermission();
      const b=document.getElementById('waveAlertButton');
      if(b) b.textContent=p==='granted'?'Alerts Enabled':'Enable Alerts';
    }catch(e){}
  };

  function maybeNotify(drawId,wave){
    if(!wave?.alert||!('Notification' in window)||Notification.permission!=='granted') return;
    const lead=wave?.leadership?.currentLeaderCore3;
    const key=String(drawId||'')+':'+String(wave.state||'')+':'+String(wave.score||0)+':'+coreText(lead);
    if(localStorage.getItem('hotspot_wave_alert_key')===key) return;
    localStorage.setItem('hotspot_wave_alert_key',key);
    try{new Notification('Hot Spot Group Five — '+label(wave.state),{body:(wave.messageAr||('Wave score '+Number(wave.score||0)+'/100'))+' | Core3 '+coreText(lead)});}catch(e){}
  }

  function ensurePanel(id,afterId){
    let panel=document.getElementById(id);
    if(panel) return panel;
    const anchor=document.getElementById(afterId);
    if(!anchor) return null;
    panel=document.createElement('div');
    panel.id=id;
    anchor.insertAdjacentElement('afterend',panel);
    return panel;
  }

  function renderGroupWave(payload){
    const wave=payload?.wave||null;
    if(!wave) return;
    const panel=ensurePanel('wavePanel','learnerWavePanel')||ensurePanel('wavePanel','learnerContent');
    if(!panel) return;
    const state=String(wave.state||'DORMANT').toUpperCase();
    const lead=wave?.leadership||{};
    panel.className='wavePanel '+stateClass(state);
    panel.innerHTML=''
      +'<div class="waveTop">'
      +'<div><div class="small mut">Group Five / Early Wave Detection</div><div class="waveState">'+esc(label(state))+'</div></div>'
      +'<button class="waveAlertBtn" id="waveAlertButton" onclick="enableWaveNotifications()">'+(("Notification" in window)&&Notification.permission==='granted'?'Alerts Enabled':'Enable Alerts')+'</button>'
      +'</div>'
      +'<div class="waveMeta">'
      +'<span class="waveBadge">Wave Score '+Number(wave.score||0)+'/100</span>'
      +'<span class="waveBadge">Alert '+esc(wave.alertLevel||'NONE')+'</span>'
      +'<span class="waveBadge">Rotation '+Number(lead.score||0)+'/100</span>'
      +'<span class="waveBadge">Core3 Breadth '+Number(lead.rotationBreadth||0)+'/10</span>'
      +'</div>'
      +'<div class="waveLeadership">'
      +'<div class="waveLeadCard"><div class="waveLeadLabel">Current leading Core3</div><div class="waveLeadValue">'+esc(coreText(lead.currentLeaderCore3))+'</div></div>'
      +'<div class="waveLeadCard"><div class="waveLeadLabel">Previous leading Core3</div><div class="waveLeadValue">'+esc(coreText(lead.previousLeaderCore3))+'</div></div>'
      +'</div>'
      +'<div class="waveMessage">'+esc(wave.messageAr||wave.message||'No clear wave signal right now.')+'</div>'
      +'<div class="waveSource">Group Five · draw '+esc(payload?.drawId||'—')+'</div>';
  }

  function learnerCard(x){
    const since=x?.drawsSinceLast==null?'—':String(x.drawsSinceLast);
    return '<div class="learnerCompactCard">'
      +'<div class="learnerCompactNumber">'+esc(x?.number)+'</div>'
      +'<div class="learnerCompactCount">ظهر اليوم '+Number(x?.count||0)+' · آخر40 '+Number(x?.recent40||0)+'</div>'
      +'<div class="learnerCompactMeta">آخر ظهور: '+esc(x?.lastTime||'—')+'</div>'
      +'<div class="learnerCompactMeta">Draw '+esc(x?.lastDrawId||'—')+'</div>'
      +'<div class="learnerCompactMeta">منذ '+esc(since)+' سحبة</div>'
      +'</div>';
  }

  function renderLearnerDetail(data){
    if(!data?.active||!Array.isArray(data?.numberStats)||data.numberStats.length!==5) return;
    const panel=ensurePanel('learnerWavePanel','learnerContent');
    if(!panel) return;
    const wave=data?.wave||{};
    const state=String(wave.state||'DORMANT').toUpperCase();
    const l10=data?.comparison?.last10||{};
    const l20=data?.comparison?.last20||{};
    panel.className='wavePanel '+stateClass(state);
    panel.innerHTML=''
      +'<div class="waveTop"><div><div class="learnerWaveTitle">12H WAVE WATCH</div><div class="waveState">'+esc(label(state))+'</div></div>'
      +'<div class="waveMeta"><span class="waveBadge">Score '+Number(wave.score||0)+'/100</span><span class="waveBadge">Alert '+esc(wave.alertLevel||'NONE')+'</span></div></div>'
      +'<div class="learnerCompactGrid">'+data.numberStats.map(learnerCard).join('')+'</div>'
      +'<div class="learnerCompare">'
      +'<span class="learnerCompareItem">آخر 10: 3+ '+Number(l10.threePlus||0)+' · 4+ '+Number(l10.fourPlus||0)+' · 5/5 '+Number(l10.exact5||0)+'</span>'
      +'<span class="learnerCompareItem">آخر 20: 3+ '+Number(l20.threePlus||0)+' · 4+ '+Number(l20.fourPlus||0)+' · 5/5 '+Number(l20.exact5||0)+'</span>'
      +'</div>'
      +'<div class="waveSource">Latest draw '+esc(data?.latestDrawId||'—')+' · '+esc(data?.latestTime||'')+'</div>';
  }

  async function refreshLearnerWave(){
    try{
      const r=await fetch('/api/health?mode=learner-wave-detail&ts='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const j=await r.json();
      renderLearnerDetail(j);
    }catch(e){}
  }

  async function refreshGroupWave(){
    const stored=readStored();
    if(stored?.wave) renderGroupWave(stored);
    try{
      const r=await fetch('/api/sync?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const j=await r.json();
      const groupFive=j?.worker?.groupFive||j?.groupFive||null;
      const wave=groupFive?.wave||null;
      if(wave){
        const payload={drawId:j?.officialDrawId||j?.storedDrawId||groupFive?.lastSeenDrawId||null,numbers:Array.isArray(groupFive?.numbers)?groupFive.numbers:[],wave};
        storeWave(payload);renderGroupWave(payload);maybeNotify(payload.drawId,wave);return;
      }
      if(groupFive?.active===false) renderGroupWave(dormantPayload(j));
    }catch(e){}
  }

  function refreshAll(){refreshLearnerWave();refreshGroupWave();}
  setTimeout(refreshAll,1200);
  setInterval(refreshAll,60000);
  window.addEventListener('focus',refreshAll);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll();});
})();
<\/script>`;

    if(html.includes('</style>')) html=html.replace('</style>',css+'\n</style>');
    if(html.includes('</body>')) html=html.replace('</body>',addon+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='Hot Spot failed to load: '+(e?.message||e);
  }
})();
</script>
</body>
</html>
