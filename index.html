    const addon=`<script>
(function(){
  var WAVE_KEY='hotspot_group_five_wave';
  var AUTO_KEY='hotspot_core_auto_saved_v4';
  var MANUAL_KEY='hotspot_core_manual_saved_v4';
  var DRAFT_KEY='hotspot_core_manual_draft_v1';
  var allowed=['DORMANT','EARLY_SIGNAL','RISING','STRONG','COOLING','REBOUND_WATCH'];
  var labels={DORMANT:'DORMANT',EARLY_SIGNAL:'EARLY SIGNAL',RISING:'RISING',STRONG:'STRONG',COOLING:'COOLING',REBOUND_WATCH:'REBOUND WATCH'};
  var trackerLatest=null,autoDetails=[],manualDetails=[];

  function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});}
  function keyOf(nums){return (nums||[]).map(Number).filter(Number.isFinite).sort(function(a,b){return a-b;}).join('-');}
  function readJson(key,fallback){try{var v=JSON.parse(localStorage.getItem(key));return v==null?fallback:v;}catch(e){return fallback;}}
  function writeJson(key,v){try{localStorage.setItem(key,JSON.stringify(v));}catch(e){}}
  function readSets(key){var raw=readJson(key,[]);if(!Array.isArray(raw))return[];var seen={},out=[];raw.forEach(function(x){if(!Array.isArray(x))return;var nums=Array.from(new Set(x.map(Number))).filter(function(n){return Number.isInteger(n)&&n>=1&&n<=80;}).sort(function(a,b){return a-b;});if(nums.length<3||nums.length>5)return;var k=keyOf(nums);if(seen[k])return;seen[k]=1;out.push(nums);});return out;}
  function ensurePanel(id,afterId){var p=document.getElementById(id);if(p)return p;var a=document.getElementById(afterId);if(!a)return null;p=document.createElement('div');p.id=id;a.insertAdjacentElement('afterend',p);return p;}
  function stateClass(s){s=String(s||'DORMANT').toUpperCase();return allowed.indexOf(s)>=0?'wave-'+s:'wave-DORMANT';}
  function label(s){s=String(s||'DORMANT').toUpperCase();return labels[s]||s;}

  function ingestAuto(coreData){var saved=readSets(AUTO_KEY),incoming=[];if(coreData&&Array.isArray(coreData.activeCore3))incoming=incoming.concat(coreData.activeCore3.map(function(x){return x.numbers;}));if(coreData&&Array.isArray(coreData.historicalStrongCore3))incoming=incoming.concat(coreData.historicalStrongCore3.map(function(x){return x.numbers;}));var all=saved.concat(incoming),seen={},out=[];all.forEach(function(nums){if(!Array.isArray(nums))return;nums=Array.from(new Set(nums.map(Number))).filter(function(n){return Number.isInteger(n)&&n>=1&&n<=80;}).sort(function(a,b){return a-b;});if(nums.length!==3)return;var k=keyOf(nums);if(seen[k])return;seen[k]=1;out.push(nums);});writeJson(AUTO_KEY,out);return out;}

  function statusFor(detail){var c=detail&&detail.current?detail.current:{};if(c.appearedNow)return{text:'ظهر الآن ✅',hit:true};var rem=Number(c.remainingToAverage);if(Number.isFinite(rem)){if(rem>0)return{text:'باقي '+rem+' سحبة',hit:false};if(rem===0)return{text:'الآن تقريبًا',hit:false};return{text:'تجاوز المتوسط بـ '+Math.abs(rem)+' سحبة',hit:false};}return{text:'لا يوجد تاريخ كافٍ',hit:false};}

  function trackerCard(t,kind){var nums=Array.isArray(t&&t.numbers)?t.numbers:[];var focus=nums.length===3?(t.fullSet||{}):(t.core3||t.fullSet||{});var full=t&&t.fullSet?t.fullSet:{};var c=focus.current||{},a=focus.analysis||{};var st=(full.current&&full.current.appearedNow)?{text:'المجموعة كاملة ظهرت الآن ✅',hit:true}:statusFor(focus);var stale=kind==='auto'&&Number(c.currentGap)>25;var tag=kind==='manual'?'يدوي':(stale?'قوي سابقًا':'قوي حالي');var cls='coreItem '+(st.hit?'hit':(stale?'historical':'active'));var avg=Number(a.meanGap),together=Number(a.together||0);var last=a.lastTogetherDrawId?('Draw '+a.lastTogetherDrawId+(a.lastTogetherTime?' · '+a.lastTogetherTime:'')):'لا يوجد ظهور كامل';var coreLine='';if(nums.length>3&&focus.numbers&&focus.numbers.length===3)coreLine='<div class="coreMini">أقوى Core3 داخلها: <b>'+esc(focus.numbers.join(' - '))+'</b></div>';var remove=kind==='manual'?'<button class="removeManual" data-remove="'+esc(keyOf(nums))+'">حذف هذه المجموعة</button>':'';return '<div class="'+cls+'"><div class="coreRow"><div class="coreNums">'+nums.map(function(n){return '<div class="coreBall">'+esc(n)+'</div>';}).join('')+'</div><span class="coreTag">'+esc(tag)+'</span></div><div class="coreStatus '+(st.hit?'hit':'')+'">'+esc(st.text)+'</div>'+coreLine+'<div class="coreMini">ظهر معًا '+together+' مرات'+(Number.isFinite(avg)&&avg>0?' · متوسط الفاصل '+avg+' سحبة':'')+' · آخر ظهور: '+esc(last)+'</div>'+remove+'</div>';}

  function manualBoxesHtml(){var s='<div class="manualBoxes">';for(var i=0;i<5;i++)s+='<input class="manualNumBox" data-manual-box="'+i+'" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="'+(i+1)+'">';return s+'</div>';}

  function getManualBoxes(){return Array.prototype.slice.call(document.querySelectorAll('[data-manual-box]'));}
  function saveManualDraft(){var boxes=getManualBoxes();if(!boxes.length)return;var focus=-1;for(var i=0;i<boxes.length;i++){if(document.activeElement===boxes[i]){focus=i;break;}}writeJson(DRAFT_KEY,{values:boxes.map(function(b){return String(b.value||'');}),focus:focus});}
  function restoreManualDraft(){var d=readJson(DRAFT_KEY,{values:[],focus:-1}),boxes=getManualBoxes();if(!boxes.length)return;var vals=Array.isArray(d.values)?d.values:[];boxes.forEach(function(b,i){b.value=String(vals[i]||'').replace(/\D/g,'').slice(0,2);b.classList.remove('valid','bad');if(b.value){var n=Number(b.value);b.classList.add(Number.isInteger(n)&&n>=1&&n<=80?'valid':'bad');}});if(Number.isInteger(d.focus)&&d.focus>=0&&d.focus<boxes.length&&vals.some(function(v){return String(v||'').length>0;})){setTimeout(function(){var live=getManualBoxes();if(live[d.focus]){live[d.focus].focus();var len=live[d.focus].value.length;try{live[d.focus].setSelectionRange(len,len);}catch(e){}}},0);}}
  function focusNext(box){var boxes=getManualBoxes(),idx=boxes.indexOf(box);if(idx>=0&&idx<boxes.length-1){boxes[idx+1].focus();boxes[idx+1].select();saveManualDraft();}}
  function focusPrev(box){var boxes=getManualBoxes(),idx=boxes.indexOf(box);if(idx>0){boxes[idx-1].focus();boxes[idx-1].select();saveManualDraft();}}
  function setupManualBoxes(){getManualBoxes().forEach(function(box){
    box.addEventListener('focus',function(){saveManualDraft();});
    box.addEventListener('input',function(){box.value=String(box.value||'').replace(/\D/g,'').slice(0,2);var n=Number(box.value);box.classList.remove('valid','bad');if(!box.value){saveManualDraft();return;}if(!Number.isInteger(n)||n<1||n>80){box.classList.add('bad');saveManualDraft();return;}box.classList.add('valid');saveManualDraft();if(box.value.length===2)focusNext(box);});
    box.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key==='ArrowRight')&&box.value){e.preventDefault();focusNext(box);return;}if(e.key==='ArrowLeft'){e.preventDefault();focusPrev(box);return;}if(e.key==='Backspace'&&!box.value){e.preventDefault();focusPrev(box);}});
  });}

  function renderTracker(){var p=document.getElementById('coreTrackerBox');if(!p)return;saveManualDraft();var active=autoDetails.filter(function(t){var c=t&&t.fullSet&&t.fullSet.current?t.fullSet.current:{};return c.appearedNow||Number(c.currentGap)<=25;});var hist=autoDetails.filter(function(t){var c=t&&t.fullSet&&t.fullSet.current?t.fullSet.current:{};return Number(c.currentGap)>25;});p.innerHTML='<div class="coreTrackerTitle">STRONG / CORE3 TRACKER</div><div class="coreTrackerSub">متابعة مستقلة للثلاثيات القوية والعداد الحي. التلقائي لا يدخل إلا بعد 10 ظهورات مشتركة 3/3.</div>'+
    '<div class="manualBlock"><div class="manualTitle">إدخال يدوي — 3 إلى 5 أرقام</div><div class="manualHint">اكتب الرقم كاملًا داخل المربع. عند إدخال رقم من خانتين مثل 11 أو 17 ينتقل تلقائيًا. الرقم المفرد مثل 7 يبقى حتى تختار المربع التالي. الأرقام التي تكتبها لن تختفي عند التحديث.</div>'+manualBoxesHtml()+'<div class="manualActions"><button id="manualCoreAdd" class="manualBtn">إضافة ومتابعة</button><button id="manualCoreClear" class="manualClear">مسح</button></div><div id="manualCoreError" class="manualError"></div></div>'+
    '<div class="coreSection"><div class="coreSectionTitle">ACTIVE STRONG</div>'+(active.length?active.map(function(t){return trackerCard(t,'auto');}).join(''):'<div class="coreEmpty">لا يوجد Core3 مؤهل حاليًا بشرط 10 ظهورات مشتركة.</div>')+'</div>'+
    (hist.length?'<div class="coreSection"><div class="coreSectionTitle">HISTORICAL STRONG</div>'+hist.map(function(t){return trackerCard(t,'auto');}).join('')+'</div>':'')+
    '<div class="coreSection"><div class="coreSectionTitle">MANUAL TRACKING</div>'+(manualDetails.length?manualDetails.map(function(t){return trackerCard(t,'manual');}).join(''):'<div class="coreEmpty">لا توجد مجموعة يدوية محفوظة.</div>')+'</div><div class="coreMini">آخر Draw: '+esc(trackerLatest||'—')+'</div>';
    setupManualBoxes();restoreManualDraft();var add=document.getElementById('manualCoreAdd');if(add)add.addEventListener('click',addManual);var clear=document.getElementById('manualCoreClear');if(clear)clear.addEventListener('click',clearManualBoxes);Array.prototype.forEach.call(p.querySelectorAll('[data-remove]'),function(btn){btn.addEventListener('click',function(){removeManual(btn.getAttribute('data-remove'));});});}

  function clearManualBoxes(){writeJson(DRAFT_KEY,{values:['','','','',''],focus:0});getManualBoxes().forEach(function(b){b.value='';b.classList.remove('valid','bad');});var e=document.getElementById('manualCoreError');if(e)e.textContent='';var first=getManualBoxes()[0];if(first)first.focus();}
  function readManualNumbers(){return getManualBoxes().map(function(b){return Number(b.value);}).filter(function(n){return Number.isInteger(n)&&n>=1&&n<=80;});}
  function addManual(){var err=document.getElementById('manualCoreError');var boxes=getManualBoxes();var invalid=boxes.some(function(b){return b.value&&(!Number.isInteger(Number(b.value))||Number(b.value)<1||Number(b.value)>80);});if(invalid){if(err)err.textContent='كل رقم يجب أن يكون من 1 إلى 80.';return;}var nums=readManualNumbers();var unique=Array.from(new Set(nums));if(unique.length<3||unique.length>5){if(err)err.textContent='أدخل 3 أو 4 أو 5 أرقام مختلفة.';return;}if(unique.length!==nums.length){if(err)err.textContent='لا تكرر نفس الرقم مرتين.';return;}unique.sort(function(a,b){return a-b;});var sets=readSets(MANUAL_KEY),k=keyOf(unique);if(!sets.some(function(x){return keyOf(x)===k;}))sets.push(unique);writeJson(MANUAL_KEY,sets);writeJson(DRAFT_KEY,{values:['','','','',''],focus:0});clearManualBoxes();refreshTrackerDetails();}
  function removeManual(k){var sets=readSets(MANUAL_KEY).filter(function(x){return keyOf(x)!==k;});writeJson(MANUAL_KEY,sets);refreshTrackerDetails();}

  async function evaluateSets(sets){if(!sets.length)return[];var q=sets.slice(0,24).map(function(x){return x.join('-');}).join(';');try{var r=await fetch('/api/health?mode=tracker-evaluate&sets='+encodeURIComponent(q)+'&ts='+Date.now(),{cache:'no-store'});if(!r.ok)return[];var j=await r.json();trackerLatest=j.latestDrawId||trackerLatest;return Array.isArray(j.trackers)?j.trackers:[];}catch(e){return[];}}
  async function refreshTrackerDetails(){var values=await Promise.all([evaluateSets(readSets(AUTO_KEY)),evaluateSets(readSets(MANUAL_KEY))]);autoDetails=values[0];manualDetails=values[1];renderTracker();}

  function renderGroupWave(payload,coreData){var wave=payload&&payload.wave?payload.wave:null;var panel=ensurePanel('wavePanel','learnerWavePanel')||ensurePanel('wavePanel','learnerContent');if(!panel)return;saveManualDraft();var state=String(wave&&wave.state?wave.state:'DORMANT').toUpperCase();var nums=coreData&&coreData.groupFive&&Array.isArray(coreData.groupFive.numbers)?coreData.groupFive.numbers:(payload&&Array.isArray(payload.numbers)?payload.numbers:[]);panel.className='wavePanel '+stateClass(state);panel.innerHTML='<div class="waveTop"><div><div class="small mut">Group Five / Early Wave Detection</div><div class="waveState">'+esc(label(state))+'</div></div></div>'+(nums.length===5?'<div class="learnerGroupNums">'+nums.map(function(n){return '<div class="learnerBall">'+esc(n)+'</div>';}).join('')+'</div>':'')+'<div class="waveMeta"><span class="waveBadge">Wave '+Number(wave&&wave.score||0)+'/100</span><span class="waveBadge">'+esc(wave&&wave.alertLevel||'NONE')+'</span></div><div id="coreTrackerBox" class="coreTracker"></div>'+(wave?'<div class="waveMessage">'+esc(wave.messageAr||wave.message||'')+'</div>':'');renderTracker();}
  function renderLearner(data){var nums=Array.isArray(data&&data.numbers)?data.numbers.map(Number).filter(Number.isFinite):[];if(!data||!data.active||nums.length!==5)return;var panel=ensurePanel('learnerWavePanel','learnerContent');if(!panel)return;var wave=data.wave||{},state=String(wave.state||'DORMANT').toUpperCase(),l20=data.comparison&&data.comparison.last20?data.comparison.last20:{};panel.className='wavePanel '+stateClass(state);panel.innerHTML='<div class="waveTop"><div><div class="learnerWaveTitle">12H WAVE WATCH</div><div class="waveState">'+esc(label(state))+'</div></div><div class="waveMeta"><span class="waveBadge">Score '+Number(wave.score||0)+'/100</span><span class="waveBadge">'+esc(wave.alertLevel||'NONE')+'</span></div></div><div class="learnerGroupNums">'+nums.map(function(n){return '<div class="learnerBall">'+esc(n)+'</div>';}).join('')+'</div><div class="learnerHits"><span class="learnerHit">آخر 20 سحبة</span><span class="learnerHit">3/5+ = '+Number(l20.threePlus||0)+'</span><span class="learnerHit">4/5+ = '+Number(l20.fourPlus||0)+'</span><span class="learnerHit">5/5 = '+Number(l20.exact5||0)+'</span></div>';}
  async function refreshLearner(){try{var r=await fetch('/api/health?mode=learner-wave-detail&ts='+Date.now(),{cache:'no-store'});if(r.ok)renderLearner(await r.json());}catch(e){}}
  async function refreshGroup(){var stored=readJson(WAVE_KEY,null);try{var values=await Promise.all([fetch('/api/sync?ts='+Date.now(),{cache:'no-store'}),fetch('/api/health?mode=group-five-core3&ts='+Date.now(),{cache:'no-store'})]);var syncRes=values[0],coreRes=values[1],coreData=coreRes.ok?await coreRes.json():null;if(coreData){trackerLatest=coreData.latestDrawId||trackerLatest;ingestAuto(coreData);}var payload=stored||{numbers:coreData&&coreData.groupFive?coreData.groupFive.numbers:[],wave:null};if(syncRes.ok){var j=await syncRes.json(),gf=j&&j.worker&&j.worker.groupFive?j.worker.groupFive:(j?j.groupFive:null),wave=gf&&gf.wave?gf.wave:(stored?stored.wave:null);payload={numbers:gf&&Array.isArray(gf.numbers)?gf.numbers:(coreData&&coreData.groupFive?coreData.groupFive.numbers:[]),wave:wave};if(wave)writeJson(WAVE_KEY,payload);}renderGroupWave(payload,coreData);await refreshTrackerDetails();}catch(e){renderGroupWave(stored||{wave:null},null);await refreshTrackerDetails();}}

    if(html.includes('</style>')) html=html.replace('</style>',css+'\n</style>');
