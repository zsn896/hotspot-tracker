name: CatBoost experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ml/**', 'api/ml-data.js', '.github/workflows/catboost.yml']
  pull_request:
    paths: ['ml/**', 'api/ml-data.js', '.github/workflows/catboost.yml']
permissions:
  contents: read
concurrency:
  group: catboost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s ml -p 'test_*.py' -v
  train:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - name: Fetch protected training snapshot after deployment
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python ml/fetch_archive.py
      - name: Train and evaluate frozen experiment
        run: python ml/train_catboost.py --input training-draws.json --output catboost-output
      - name: Save models, data snapshot and all test predictions
        uses: actions/upload-artifact@v4
        with:
          name: catboost-${{ github.sha }}-${{ github.run_id }}
          path: |
            catboost-output/
            training-draws.json
            ml/requirements.txt
          retention-days: 90
      - name: Summarize experiment
        run: |
          python - <<'PY'
          import json,os
          report=json.load(open('catboost-output/report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write('# CatBoost historical experiment\n\nNo production model was replaced. Smaller Brier is better.\n\n')
            out.write('| Target | CatBoost | Logistic | Empirical | Chance |\n|---|---:|---:|---:|---:|\n')
            for r in report['results']:
              if r['status']!='evaluated':continue
              out.write('| '+ '-'.join(map(str,r['target']))+' | '+' | '.join(f"{r['metrics'][name]['brier']:.5f}" for name in ['catboost','logistic','empirical','chance'])+' |\n')
          PY
