name: Apply 12H Wave UI

on:
  push:
    paths:
      - '.github/workflows/patch-wave-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          css_anchor = """.learnerStrong{\n  display:grid;\n  grid-template-columns:repeat(5,1fr);\n  gap:8px;\n  margin-top:10px\n}\n"""
          css_block = """.wavePanel{\n  margin-top:14px;\n  padding:14px;\n  border-radius:13px;\n  border:1px solid var(--line);\n  background:rgba(7,17,31,.42)\n}\n\n.waveTop{\n  display:flex;\n  justify-content:space-between;\n  align-items:center;\n  gap:10px;\n  flex-wrap:wrap\n}\n\n.waveState{\n  font-size:20px;\n  font-weight:950\n}\n\n.waveMeta{\n  display:flex;\n  gap:8px;\n  flex-wrap:wrap;\n  margin-top:10px\n}\n\n.waveBadge{\n  display:inline-flex;\n  align-items:center;\n  padding:6px 9px;\n  border-radius:999px;\n  border:1px solid currentColor;\n  font-size:11px;\n  font-weight:900\n}\n\n.waveMessage{\n  margin-top:10px;\n  line-height:1.5;\n  font-size:13px\n}\n\n.waveAlertBtn{\n  border:1px solid #4b5f78;\n  background:#203249;\n  color:white;\n  border-radius:9px;\n  padding:8px 10px;\n  font-size:12px;\n  font-weight:900;\n  cursor:pointer\n}\n\n.wave-DORMANT{color:#9fb0c7;border-color:#3a4b60}\n.wave-EARLY_SIGNAL{color:#f6c453;border-color:rgba(246,196,83,.55);background:rgba(246,196,83,.06)}\n.wave-RISING{color:#55a2ff;border-color:rgba(85,162,255,.55);background:rgba(47,128,255,.08)}\n.wave-STRONG{color:#43ea82;border-color:rgba(67,234,130,.60);background:rgba(34,197,94,.09);box-shadow:0 0 0 1px rgba(34,197,94,.12)}\n.wave-COOLING{color:#b5c3d6;border-color:#51647b;background:rgba(159,176,199,.05)}\n.wave-REBOUND_WATCH{color:#ff9d3b;border-color:rgba(255,157,59,.60);background:rgba(255,146,43,.08)}\n\n"""
          if '.wavePanel{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_block + css_anchor, 1)

          js_anchor = """function renderLearner(j){\n"""
          js_block = r'''function waveClass(state){

  const allowed = [
    'DORMANT',
    'EARLY_SIGNAL',
    'RISING',
    'STRONG',
    'COOLING',
    'REBOUND_WATCH'
  ];

  const value =
    String(state || 'DORMANT')
      .toUpperCase();

  return allowed.includes(value)
    ? `wave-${value}`
    : 'wave-DORMANT';
}


function waveLabel(state){

  const labels = {
    DORMANT:'DORMANT',
    EARLY_SIGNAL:'EARLY SIGNAL',
    RISING:'RISING',
    STRONG:'STRONG',
    COOLING:'COOLING',
    REBOUND_WATCH:'REBOUND WATCH'
  };

  const key =
    String(state || 'DORMANT')
      .toUpperCase();

  return labels[key] || key;
}


function enableWaveNotifications(){

  if(!('Notification' in window)){
    alert('Browser notifications are not supported on this device/browser.');
    return;
  }

  Notification
    .requestPermission()
    .then(permission => {
      const btn =
        document.getElementById(
          'waveAlertButton'
        );

      if(btn){
        btn.textContent =
          permission === 'granted'
            ? 'Alerts Enabled'
            : 'Enable Alerts';
      }
    });
}


function maybeNotifyWave(j){

  const wave =
    j?.wave
    ||
    j?.suggestion?.wave
    ||
    null;

  if(
    !wave?.alert
    ||
    !('Notification' in window)
    ||
    Notification.permission !== 'granted'
  ){
    return;
  }

  const key =
    `${j?.latestDrawId || ''}:${wave.state || ''}:${wave.score || 0}`;

  if(
    localStorage.getItem(
      'hotspot_wave_alert_key'
    ) === key
  ){
    return;
  }

  localStorage.setItem(
    'hotspot_wave_alert_key',
    key
  );

  new Notification(
    `Hot Spot — ${waveLabel(wave.state)}`,
    {
      body:
        wave.messageAr
        ||
        `Wave score ${Number(wave.score || 0)}/100 — ${String(wave.alertLevel || 'ALERT')}`
    }
  );
}


'''
          if 'function waveClass(state){' not in s:
              if js_anchor not in s:
                  raise SystemExit('JS anchor not found')
              s = s.replace(js_anchor, js_block + js_anchor, 1)

          data_anchor = """  const strongest =\n    Array.isArray(\n      j.strongestNumbers\n    )\n      ?\n      j.strongestNumbers\n      :\n      [];\n\n  root.innerHTML =\n"""
          data_replacement = """  const strongest =\n    Array.isArray(\n      j.strongestNumbers\n    )\n      ?\n      j.strongestNumbers\n      :\n      [];\n\n  const wave =\n    j?.wave\n    ||\n    suggestion?.wave\n    ||\n    null;\n\n  const waveState =\n    String(\n      wave?.state ||\n      'DORMANT'\n    ).toUpperCase();\n\n  const waveScore =\n    Number(\n      wave?.score || 0\n    );\n\n  const waveLevel =\n    String(\n      wave?.alertLevel ||\n      'NONE'\n    );\n\n  root.innerHTML =\n"""
          if 'const waveState =' not in s:
              if data_anchor not in s:
                  raise SystemExit('Learner data anchor not found')
              s = s.replace(data_anchor, data_replacement, 1)

          ui_anchor = """    <div class=\"learnerStats\">\n"""
          ui_block = r'''    ${
      wave
        ?
        `
        <div class="wavePanel ${waveClass(waveState)}">

          <div class="waveTop">

            <div>
              <div class="small mut">Group Cycle / Early Wave Detection</div>
              <div class="waveState">
                ${esc(waveLabel(waveState))}
              </div>
            </div>

            <button
              class="waveAlertBtn"
              id="waveAlertButton"
              onclick="enableWaveNotifications()"
            >
              ${
                ('Notification' in window)
                &&
                Notification.permission === 'granted'
                  ?
                  'Alerts Enabled'
                  :
                  'Enable Alerts'
              }
            </button>

          </div>

          <div class="waveMeta">
            <span class="waveBadge">Wave Score ${waveScore}/100</span>
            <span class="waveBadge">Alert ${esc(waveLevel)}</span>
            <span class="waveBadge">${wave?.alert ? 'ACTIVE ALERT' : 'MONITORING'}</span>
          </div>

          <div class="waveMessage">
            ${esc(
              wave?.messageAr
              ||
              'No clear wave signal right now.'
            )}
          </div>

        </div>
        `
        :
        ''
    }


'''
          if 'Group Cycle / Early Wave Detection' not in s:
              marker_pos = s.find(ui_anchor, s.find('function renderLearner(j){'))
              if marker_pos < 0:
                  raise SystemExit('Learner UI anchor not found')
              s = s[:marker_pos] + ui_block + s[marker_pos:]

          end_anchor = """    `;\n}\n\n\n/* AUTOMATIC GROUPS */\n"""
          end_replacement = """    `;\n\n  maybeNotifyWave(j);\n}\n\n\n/* AUTOMATIC GROUPS */\n"""
          if 'maybeNotifyWave(j);' not in s:
              if end_anchor not in s:
                  raise SystemExit('Learner end anchor not found')
              s = s.replace(end_anchor, end_replacement, 1)

          p.write_text(s)
          PY

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/index-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/index-inline.js

      - name: Commit UI integration and remove temporary workflow
        run: |
          git config user.name "hotspot-wave-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-wave-ui.yml
          git add index.html
          git diff --cached --check
          git commit -m "Show 12H wave state and alerts in UI"
          git push
