name: Forecast V2 evaluation
on:
  workflow_dispatch:
  push:
    branches: [main, improve/forecast-v2]
    paths: ['ml/forecast_v2.py', 'ml/prepare_training.py', 'ml/audit_training.py', 'ml/test_forecast_v2.py', '.github/workflows/forecast-v2.yml']
  pull_request:
    paths: ['ml/forecast_v2.py', 'ml/prepare_training.py', 'ml/audit_training.py', 'ml/test_forecast_v2.py', '.github/workflows/forecast-v2.yml']
permissions:
  contents: read
concurrency:
  group: forecast-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s ml -p 'test_*.py' -v
  evaluate:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - name: Read protected archive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python ml/fetch_archive.py
      - name: Audit suspect archive records against official results
        run: python ml/audit_training.py --input training-draws.json --output forecast-v2-output
      - name: Evaluate frozen six groups using the reviewed copy
        run: python ml/forecast_v2.py --input training-draws.json --reviewed forecast-v2-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-v2-${{ github.sha }}-${{ github.run_id }}
          path: |
            forecast-v2-output/
            training-draws.json
            ml/requirements.txt
          retention-days: 90
