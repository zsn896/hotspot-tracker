name: Export HotSpot Project Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-project-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create exact pre-helper project ZIP
        run: |
          git archive --format=zip --output=HotSpot_Project_Current.zip HEAD^
          unzip -t HotSpot_Project_Current.zip

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HotSpot_Project_Current
          path: HotSpot_Project_Current.zip
          if-no-files-found: error
          retention-days: 1
