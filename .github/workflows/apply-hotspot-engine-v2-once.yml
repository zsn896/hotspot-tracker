name: Apply HotSpot Engine V2 Once

on:
  push:
    branches: [main]
    paths:
      - '_hotspot_engine_v2_payload.part*'
      - '.github/workflows/apply-hotspot-engine-v2-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply uploaded package exactly
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f _hotspot_engine_v2_payload.part00 ]; then
            echo "Payload already cleaned up; nothing to do."
            exit 0
          fi

          test -f _hotspot_engine_v2_payload.part01
          test -f _hotspot_engine_v2_payload.part02
          test -f _hotspot_engine_v2_payload.part03

          cat \
            _hotspot_engine_v2_payload.part00 \
            _hotspot_engine_v2_payload.part01 \
            _hotspot_engine_v2_payload.part02 \
            _hotspot_engine_v2_payload.part03 \
            > /tmp/hotspot-engine-v2.b64

          base64 -d /tmp/hotspot-engine-v2.b64 > /tmp/hotspot-engine-v2.zip
          echo '78c182a133b96965ae39a48a6530c46ae0b79f64acb4767bc473af2d1e275495  /tmp/hotspot-engine-v2.zip' | sha256sum -c -
          unzip -t /tmp/hotspot-engine-v2.zip

          rm -rf /tmp/hotspot-engine-v2
          mkdir -p /tmp/hotspot-engine-v2
          unzip -q /tmp/hotspot-engine-v2.zip -d /tmp/hotspot-engine-v2
          SRC=/tmp/hotspot-engine-v2/hotspot-engine-v2
          test -d "$SRC"

          while IFS= read -r -d '' file; do
            rel="${file#$SRC/}"
            mkdir -p "$(dirname "$rel")"
            cp -p "$file" "$rel"
          done < <(find "$SRC" -type f -print0)

          while IFS= read -r -d '' file; do
            rel="${file#$SRC/}"
            src_hash=$(sha256sum "$file" | awk '{print $1}')
            dst_hash=$(sha256sum "$rel" | awk '{print $1}')
            if [ "$src_hash" != "$dst_hash" ]; then
              echo "Mismatch: $rel"
              exit 1
            fi
          done < <(find "$SRC" -type f -print0)

          rm -f _hotspot_engine_v2_payload.b64
          rm -f _hotspot_engine_v2_payload.part00
          rm -f _hotspot_engine_v2_payload.part01
          rm -f _hotspot_engine_v2_payload.part02
          rm -f _hotspot_engine_v2_payload.part03
          rm -f .github/workflows/apply-hotspot-engine-v2-once.yml

          git config user.name "zsn896"
          git config user.email "48352047+zsn896@users.noreply.github.com"
          git add -A
          git commit -m "Apply hotspot-engine-v2 package exactly"
          git push origin HEAD:main
