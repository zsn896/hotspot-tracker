name: Apply HotSpot Engine V2 Once

on:
  push:
    branches: [main]
    paths:
      - '_hotspot_engine_v2_payload.b64'
      - '.github/workflows/apply-hotspot-engine-v2-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply uploaded package exactly
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _hotspot_engine_v2_payload.b64 ]; then
            echo "Payload already cleaned up; nothing to do."
            exit 0
          fi
          mkdir -p /tmp/hotspot-engine-v2
          base64 -d _hotspot_engine_v2_payload.b64 > /tmp/hotspot-engine-v2.zip
          unzip -q /tmp/hotspot-engine-v2.zip -d /tmp/hotspot-engine-v2
          SRC=/tmp/hotspot-engine-v2/hotspot-engine-v2
          test -d "$SRC"

          while IFS= read -r -d '' file; do
            rel="${file#$SRC/}"
            mkdir -p "$(dirname "$rel")"
            cp -p "$file" "$rel"
          done < <(find "$SRC" -type f -print0)

          while IFS= read -r -d '' file; do
            rel="${file#$SRC/}"
            src_hash=$(sha256sum "$file" | awk '{print $1}')
            dst_hash=$(sha256sum "$rel" | awk '{print $1}')
            test "$src_hash" = "$dst_hash"
          done < <(find "$SRC" -type f -print0)

          rm -f _hotspot_engine_v2_payload.b64
          rm -f .github/workflows/apply-hotspot-engine-v2-once.yml

          git config user.name "zsn896"
          git config user.email "48352047+zsn896@users.noreply.github.com"
          git add -A
          git commit -m "Apply hotspot-engine-v2 package exactly"
          git push origin HEAD:main
