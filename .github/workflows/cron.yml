name: HotSpot Worker Cron

# Calls /api/worker on a schedule.
#
# The previous version used `curl -fsS`. The -f flag makes curl exit with an
# error AND discard the response body, so a failure showed up as "failed" with
# no reason attached. This version prints the HTTP status and the response
# before deciding whether to fail, so the log always says what went wrong.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the secrets exist
        run: |
          if [ -z "${{ secrets.WORKER_URL }}" ]; then
            echo "::error::The WORKER_URL secret is not set."
            echo "Add it in Settings -> Secrets and variables -> Actions"
            echo "Value should look like: https://your-app.vercel.app/api/worker"
            exit 1
          fi
          if [ -z "${{ secrets.WORKER_SECRET }}" ]; then
            echo "::error::The WORKER_SECRET secret is not set."
            echo "It must match WORKER_SECRET in your Vercel environment variables."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Advance the cycle
        run: |
          # No -f here: we want the body even when the status is not 200.
          status=$(curl -sS --max-time 90 \
            -o response.txt \
            -w '%{http_code}' \
            -H "x-worker-secret: ${{ secrets.WORKER_SECRET }}" \
            -H "accept: application/json" \
            "${{ secrets.WORKER_URL }}") || true

          echo "HTTP status: ${status:-none}"
          echo "----- response body -----"
          head -c 4000 response.txt || echo "(empty response)"
          echo
          echo "-------------------------"

          case "$status" in
            200)
              echo "Worker ran successfully."
              ;;
            401)
              echo "::error::401 Unauthorized. WORKER_SECRET here does not match the one set in Vercel."
              exit 1
              ;;
            307|308|302)
              echo "::error::Redirected. Vercel Deployment Protection is still on."
              echo "Turn it off under Settings -> Deployment Protection, or use a bypass token."
              exit 1
              ;;
            404)
              echo "::error::404. WORKER_URL is wrong, or api/worker.js is not deployed."
              exit 1
              ;;
            500|502)
              echo "::error::Server error. The body above names the cause - usually a missing table or column in Supabase."
              exit 1
              ;;
            504)
              echo "::error::504 timeout. The function exceeded its maxDuration."
              exit 1
              ;;
            *)
              echo "::error::Unexpected status '${status}'. See the body above."
              exit 1
              ;;
          esac

