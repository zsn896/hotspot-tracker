name: HotSpot Worker Cron

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: hotspot-worker-cron
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call protected cron endpoint
        run: |
          echo "Calling HotSpot cron endpoint..."

          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 55 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://zsn896hotspottrackerlatest.vercel.app/api/cron

          echo "Cron call completed."
